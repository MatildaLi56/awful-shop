models:
  - name: dim_supply
    description: Supply dimension, one row per supply (ingredients and packaging the stores stock).
    columns:
      - name: supply_key
        description: Surrogate key of the supply, generated from supply_id. Inventory facts join on this.
        data_tests:
          - not_null
          - unique
      - name: supply_id
        description: The supply's ID in the source system, for example SUP-001.
        data_tests:
          - not_null
          - unique
      - name: supply_name
        description: Name of the supply.
      - name: supply_cost
        description: Cost of one unit of the supply, in dollars.
      - name: is_perishable_supply
        description: True if the supply spoils and has to be used quickly.
