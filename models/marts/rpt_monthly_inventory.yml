models:
  - name: rpt_monthly_inventory
    description: Monthly stock per store and supply, one row per month, store and supply.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [month_start_date, location_id, supply_key]
    columns:
      - name: on_hand_qty
        description: Units on hand in the month.
